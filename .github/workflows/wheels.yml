name: Build Wheels

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release tag version, without the v prefix (for example, 1.3.0)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    strategy:
      matrix:
        python-version: [3.9]
    steps:
      - name: Validate version
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[test]
          pip install build twine

      - name: Build Graph
        run: |
          python -m tn --text "2.5平方电线" --overwrite_cache --language "zh" --cache_dir graph
          python -m tn --text "2010-03-21" --overwrite_cache --language "en" --cache_dir graph
          python -m itn --text "二点五平方电线" --overwrite_cache --cache_dir graph
          python -m itn --text "one two three" --overwrite_cache --language "en" --cache_dir graph

      - name: Upload Graph
        uses: actions/upload-artifact@v4
        with:
          name: release-graph-v${{ inputs.version }}
          path: graph
          if-no-files-found: error

      - name: Build package
        run: |
          python -m build
          python -m twine check dist/*

      - name: Verify package version and resources
        run: |
          python - <<'PY'
          from email.parser import BytesParser
          import os
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          with ZipFile(wheels[0]) as wheel:
              names = set(wheel.namelist())
              metadata_name = next(name for name in names if name.endswith(".dist-info/METADATA"))
              metadata = BytesParser().parsebytes(wheel.read(metadata_name))
              assert metadata["Version"] == os.environ["RELEASE_VERSION"], metadata["Version"]
              resources = {
                  path.as_posix()
                  for package in ("tn", "itn")
                  for path in Path(package).rglob("*")
                  if path.is_file() and path.suffix in (".tsv", ".far")
                  and "test" not in path.parts
              }
              missing = resources - names
              assert not missing, sorted(missing)
              print("Verified version", metadata["Version"], "and", len(resources), "resources")
          PY

      - name: Publish on pypi.org
        if: github.ref == 'refs/heads/master' && github.repository == 'wenet-e2e/WeTextProcessing'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m twine upload dist/*
